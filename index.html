<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#02070d">
<title>Jarvis</title>
<style>
  :root { --c: #3fd8ff; --c2: #0e6f93; --bg: #02070d; --spd: 1; }
  body.listening { --c: #7dffb2; --c2: #1d8a55; }
  body.thinking { --c: #ffc95c; --c2: #8a6a1d; --spd: 0.2; }
  body.speaking { --spd: 0.4; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: #cdf3ff;
    font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; position: relative;
    height: 100vh; height: 100dvh;
  }
  #bg { position: fixed; left: 0; top: 0; z-index: 0; pointer-events: none; animation: drift 45s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: scale(1.03) translate(-6px, 4px); } to { transform: scale(1.03) translate(6px, -4px); } }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .10; z-index: 1;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, #000 3px); }
  header { display: flex; justify-content: space-between; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 20px 6px; z-index: 5; position: relative; }
  .brand { letter-spacing: 8px; font-size: 20px; color: var(--c); text-shadow: 0 0 14px var(--c); transition: color .4s; }
  button { border: 1px solid var(--c); background: rgba(10,34,51,.7); color: var(--c); border-radius: 12px;
    padding: 12px 16px; font-size: 16px; transition: all .3s; font-family: inherit; }
  button:active { background: var(--c); color: var(--bg); }
  #gear { padding: 6px 12px; font-size: 15px; }

  #settings { display: none; position: absolute; top: calc(52px + env(safe-area-inset-top)); left: 16px; right: 16px;
    padding: 14px; border: 1px solid var(--c2); border-radius: 12px; background: rgba(4,16,26,.96); z-index: 15; }
  #settings input { width: 100%; padding: 10px; margin: 6px 0 10px; border-radius: 10px; border: 1px solid var(--c2);
    background: #06131d; color: #cdf3ff; font-size: 16px; }

  #hud { position: relative; height: 54vh; min-height: 320px; max-height: 560px; z-index: 2; flex: 0 0 auto; }
  #eyewrap { position: absolute; left: 50%; top: 18px; bottom: 78px; aspect-ratio: 1; transform: translateX(-50%); }
  #eyesvg { width: 100%; height: 100%; filter: drop-shadow(0 0 12px var(--c)); overflow: visible; display: block; }
  .ring { fill: none; stroke: var(--c); transform-box: view-box; transform-origin: 50% 50%; transition: stroke .4s; }
  .r1 { stroke-width: 1.2; stroke-dasharray: 2 5; animation: spin calc(40s * var(--spd)) linear infinite; }
  .r2 { stroke-width: 3; stroke-dasharray: 60 20 10 20; animation: spin calc(14s * var(--spd)) linear infinite reverse; }
  .r3 { stroke-width: 1.5; stroke-dasharray: 90 30; animation: spin calc(22s * var(--spd)) linear infinite; }
  .r4 { stroke-width: 4; stroke-dasharray: 30 24; opacity: .8; animation: spin calc(9s * var(--spd)) linear infinite reverse; }
  .core { animation: pulse calc(3s * var(--spd)) ease-in-out infinite; transform-box: view-box; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .8; } 50% { transform: scale(1.06); opacity: 1; } }
  #status { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 5px;
    color: var(--c); text-shadow: 0 0 8px var(--c); transition: color .4s; z-index: 3; }

  .sat { position: absolute; width: 66px; height: 66px; border-radius: 50%; padding: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 19px; line-height: 1.1;
    background: radial-gradient(circle, rgba(14,60,84,.85), rgba(4,16,26,.92)); border: 1.5px solid var(--c); box-shadow: 0 0 14px var(--c2); z-index: 4; }
  .sat small { font-size: 9px; letter-spacing: 1.5px; opacity: .85; }
  .sat::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1px dashed var(--c); opacity: .6; animation: spin 14s linear infinite; }
  .sat::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c);
    top: -10px; left: 30px; transform-origin: 3px 43px; animation: spin 7s linear infinite; }
  #satV { left: max(10px, calc(50% - 250px)); top: calc(50% - 60px); }
  #satM { right: max(10px, calc(50% - 250px)); top: calc(50% - 60px); }
  #satT { left: 50%; bottom: 6px; margin-left: -33px; }

  #chat { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 12px; z-index: 2; -webkit-overflow-scrolling: touch; position: relative; }
  .msg { max-width: 82%; margin: 8px 0; padding: 10px 14px; line-height: 1.45; white-space: pre-wrap; font-size: 16px; }
  .bot { background: linear-gradient(135deg, rgba(8,30,46,.88), rgba(5,16,26,.88)); border: 1px solid var(--c2); border-left: 3px solid var(--c); border-radius: 4px 14px 14px 14px; }
  .user { margin-left: auto; text-align: right; background: rgba(14,60,84,.6); border: 1px solid var(--c2); border-right: 3px solid var(--c); border-radius: 14px 4px 14px 14px; }

  #bar { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--c2); background: rgba(2,10,16,.88); z-index: 5; position: relative; }
  #text { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--c2); background: #06131d; color: #cdf3ff; font-size: 16px; outline: none; }
  #text:focus { border-color: var(--c); box-shadow: 0 0 10px var(--c2); }
  #mic.on { background: var(--c); color: var(--bg); box-shadow: 0 0 16px var(--c); }

  #overlay { position: fixed; inset: 0; background: rgba(0,5,10,.62); display: none; align-items: center; justify-content: center; z-index: 30; }
  #panel { width: min(92vw, 520px); max-height: 82vh; overflow: auto; border: 1px solid var(--c); border-radius: 16px;
    background: rgba(4,16,26,.96); box-shadow: 0 0 30px var(--c2); padding: 18px; }
  .phead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  #ptitle { letter-spacing: 5px; color: var(--c); font-size: 15px; }
  #pclose { padding: 6px 12px; }
  #panel label { display: block; font-size: 12px; letter-spacing: 2px; color: var(--c); margin: 12px 0 6px; opacity: .85; }
  #panel select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--c2); background: #06131d; color: #cdf3ff; font-size: 16px; }
  #panel input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .row button { padding: 9px 14px; font-size: 14px; }
  .big { font-size: 54px; text-align: center; color: var(--c); text-shadow: 0 0 16px var(--c); font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  .sub { text-align: center; opacity: .8; margin-bottom: 10px; }
  .wc { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--c2); font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; opacity: .65; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<header>
  <div class="brand">JARVIS</div>
  <button id="gear">⚙︎</button>
</header>

<div id="settings">
  Chiave API Gemini:
  <input id="key" type="password" placeholder="Incolla qui la chiave (vuoto = non cambiare)">
  Modello:
  <input id="model" type="text">
  <button id="save">Salva</button>
</div>

<div id="hud">
  <div id="status">SISTEMI IN AVVIO</div>
  <div id="eyewrap">
    <svg id="eyesvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="coreGrad">
          <stop id="g0" offset="0%" stop-color="#9eeaff"/>
          <stop id="g1" offset="60%" stop-color="#0a7fa6" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#0a5f80" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sclera" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#f7fafc"/>
          <stop offset="60%" stop-color="#e3eaf0"/>
          <stop offset="100%" stop-color="#b58c8c"/>
        </radialGradient>
        <radialGradient id="irisG">
          <stop id="i0" offset="0%" stop-color="#0b3a4a"/>
          <stop id="i1" offset="42%" stop-color="#5fe0ff"/>
          <stop id="i2" offset="82%" stop-color="#1590b5"/>
          <stop id="i3" offset="100%" stop-color="#03141b"/>
        </radialGradient>
        <linearGradient id="lidShadow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#000" stop-opacity=".6"/>
          <stop offset="45%" stop-color="#000" stop-opacity="0"/>
          <stop offset="100%" stop-color="#000" stop-opacity=".25"/>
        </linearGradient>
        <clipPath id="eyeClip"><path d="M20,100 Q100,30 180,100 Q100,170 20,100 Z"/></clipPath>
        <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>

      <circle class="ring r1" cx="100" cy="100" r="96"/>
      <circle class="ring r2" cx="100" cy="100" r="86"/>
      <circle class="ring r3" cx="100" cy="100" r="74"/>
      <circle class="ring r4" cx="100" cy="100" r="64"/>
      <circle class="core" cx="100" cy="100" r="70" fill="url(#coreGrad)"/>

      <g clip-path="url(#eyeClip)">
        <rect x="15" y="55" width="170" height="90" fill="url(#sclera)"/>
        <ellipse cx="27" cy="101" rx="9" ry="7" fill="#d98a8a" opacity=".75"/>
        <g stroke="#b33" fill="none" stroke-width=".5" opacity=".35">
          <path d="M22,100 Q40,96 58,98"/><path d="M26,104 Q44,106 60,103"/>
          <path d="M34,98 Q42,90 50,88"/><path d="M178,100 Q160,96 142,98"/>
          <path d="M176,104 Q158,106 142,104"/><path d="M168,98 Q158,90 150,89"/>
        </g>
        <g id="gaze">
          <circle cx="100" cy="100" r="31" fill="url(#irisG)"/>
          <g id="fibD" stroke="#000" stroke-width=".7" opacity=".5"></g>
          <g id="fibL" stroke="#9eeaff" stroke-width=".6" opacity=".6"></g>
          <circle id="colr" cx="100" cy="100" r="16" fill="none" stroke="#fff" stroke-width="1.6" opacity=".35"/>
          <circle cx="100" cy="100" r="30.5" fill="none" stroke="#000" stroke-width="3.2" opacity=".85"/>
          <circle id="pupil" cx="100" cy="100" r="11" fill="#000"/>
        </g>
        <ellipse cx="85" cy="85" rx="9" ry="5" fill="#fff" opacity=".85" transform="rotate(-25 85 85)"/>
        <circle cx="117" cy="114" r="3" fill="#fff" opacity=".5"/>
        <rect x="15" y="55" width="170" height="90" fill="url(#lidShadow)"/>
        <path d="M20,100 Q100,30 180,100 Q100,170 20,100 Z" fill="none" stroke="#000" stroke-width="12" opacity=".5" filter="url(#soft)"/>
        <path id="lidU" fill="#04101a"/>
        <path id="lidL" fill="#04101a"/>
      </g>
      <path d="M28,88 Q100,8 172,88" fill="none" style="stroke:var(--c2)" stroke-width="1.2" opacity=".6"/>
      <path id="edgeU" fill="none" style="stroke:var(--c)" stroke-width="1.8" stroke-linecap="round"/>
      <path id="edgeL" fill="none" style="stroke:var(--c)" stroke-width="1.8" stroke-linecap="round"/>
      <g id="lashes" style="stroke:var(--c)" stroke-width="1" stroke-linecap="round"></g>
    </svg>
  </div>

  <button class="sat" id="satV"><span>🔊</span><small>VOCE</small></button>
  <button class="sat" id="satM"><span id="satMi">🌤️</span><small>METEO</small></button>
  <button class="sat" id="satT"><span id="satTi" style="font-size:17px">--:--</span><small>ORA</small></button>
</div>

<div id="chat"></div>

<div id="bar">
  <button id="mic">🎤</button>
  <input id="text" type="text" placeholder="Scrivi o tocca il microfono…">
  <button id="send">Invia</button>
</div>

<div id="overlay"><div id="panel">
  <div class="phead"><div id="ptitle"></div><button id="pclose">✕</button></div>
  <div id="pbody"></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SYSTEM = "Sei Jarvis, un assistente personale elegante, efficiente e cortese, in stile maggiordomo high-tech. Rispondi sempre in italiano, in modo breve e chiaro (massimo 3-4 frasi, salvo richiesta diversa). Non usare elenchi puntati né asterischi: le tue risposte vengono lette ad alta voce.";
const DEFAULT_MODEL = "gemini-3.5-flash-lite";
let history = [];
let listening = false, thinking = false, speaking = false;
let WX = null;

$("model").value = store.get("jarvis_model", DEFAULT_MODEL);
if (!store.get("jarvis_key", "")) $("settings").style.display = "block";

/* ---------- STATO ---------- */
function setState() {
  document.body.classList.toggle("listening", listening);
  document.body.classList.toggle("thinking", thinking);
  document.body.classList.toggle("speaking", speaking);
  $("status").textContent = listening ? "TI ASCOLTO…" : thinking ? "ELABORO…" : speaking ? "PARLO…" : "IN ATTESA";
}

/* ---------- IMPOSTAZIONI ---------- */
$("gear").onclick = () => { $("settings").style.display = $("settings").style.display === "block" ? "none" : "block"; };
$("save").onclick = () => {
  if ($("key").value.trim()) store.set("jarvis_key", $("key").value.trim());
  store.set("jarvis_model", $("model").value.trim() || DEFAULT_MODEL);
  $("key").value = "";
  $("settings").style.display = "none";
  addMsg("Impostazioni salvate.", "bot");
};

/* ---------- CHAT ---------- */
function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}

/* ---------- VOCE ---------- */
let voiceCfg = { name: "", rate: 1, pitch: 1 };
try { Object.assign(voiceCfg, JSON.parse(store.get("jarvis_voice", "{}"))); } catch (e) {}
function saveVoice() { store.set("jarvis_voice", JSON.stringify(voiceCfg)); }
if (window.speechSynthesis) speechSynthesis.getVoices();

function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[*_#`]/g, ""));
  u.lang = "it-IT";
  const vs = speechSynthesis.getVoices();
  const v = vs.find(v => v.name === voiceCfg.name) || vs.find(v => v.lang && v.lang.toLowerCase().startsWith("it"));
  if (v) u.voice = v;
  u.rate = Number(voiceCfg.rate) || 1;
  u.pitch = Number(voiceCfg.pitch) || 1;
  u.onstart = () => { speaking = true; setState(); };
  u.onend = u.onerror = () => { speaking = false; setState(); };
  speechSynthesis.speak(u);
}

/* ---------- GEMINI ---------- */
function sysPrompt() {
  const now = new Date().toLocaleString("it-IT", { dateStyle: "full", timeStyle: "short" });
  let s = SYSTEM + " Data e ora attuali dell'utente: " + now + ".";
  if (WX) s += " Meteo attuale" + (WX.city ? " a " + WX.city : "") + ": " + Math.round(WX.temp) + " gradi, " + wcode(WX.code, WX.isDay).t + ".";
  return s;
}

async function ask(text) {
  const key = store.get("jarvis_key", "");
  if (!key) { $("settings").style.display = "block"; addMsg("Inserisci prima la chiave API nelle impostazioni.", "bot"); return; }
  const model = store.get("jarvis_model", DEFAULT_MODEL);
  addMsg(text, "user");
  history.push({ role: "user", parts: [{ text }] });
  const wait = addMsg("…", "bot");
  thinking = true; setState();
  try {
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: sysPrompt() }] }, contents: history.slice(-20) })
    });
    const data = await r.json();
    if (!r.ok) throw new Error((data.error && data.error.message) || "Errore " + r.status);
    const answer = data.candidates[0].content.parts.map(p => p.text || "").join("");
    history.push({ role: "model", parts: [{ text: answer }] });
    wait.textContent = answer;
    thinking = false; setState();
    speak(answer);
  } catch (e) {
    history.pop();
    wait.textContent = "Errore: " + e.message;
    thinking = false; setState();
  }
  $("chat").scrollTop = $("chat").scrollHeight;
}

function send() {
  const t = $("text").value.trim();
  if (!t) return;
  $("text").value = "";
  ask(t);
}
$("send").onclick = send;
$("text").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$("mic").onclick = () => {
  if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  if (!SR) { addMsg("Il riconoscimento vocale non è disponibile. Usa il microfono della tastiera dell'iPad.", "bot"); return; }
  if (listening) { rec.stop(); return; }
  rec = new SR();
  rec.lang = "it-IT";
  rec.interimResults = false;
  rec.onstart = () => { listening = true; $("mic").classList.add("on"); setState(); };
  rec.onend = () => { listening = false; $("mic").classList.remove("on"); setState(); };
  rec.onerror = e => addMsg("Errore microfono: " + e.error, "bot");
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.start();
};

/* ---------- OCCHIO ---------- */
const NS = "http://www.w3.org/2000/svg";
(function buildEye() {
  const fd = $("fibD"), fl = $("fibL");
  for (let i = 0; i < 110; i++) {
    const a = Math.random() * Math.PI * 2, r1 = 12 + Math.random() * 4, r2 = 22 + Math.random() * 8;
    const ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", (100 + Math.cos(a) * r1).toFixed(2));
    ln.setAttribute("y1", (100 + Math.sin(a) * r1).toFixed(2));
    ln.setAttribute("x2", (100 + Math.cos(a + (Math.random() - .5) * .12) * r2).toFixed(2));
    ln.setAttribute("y2", (100 + Math.sin(a + (Math.random() - .5) * .12) * r2).toFixed(2));
    ln.setAttribute("stroke-opacity", (0.3 + Math.random() * 0.7).toFixed(2));
    (i % 2 ? fl : fd).appendChild(ln);
  }
  const g = $("lashes");
  for (let i = 0; i < 18; i++) g.appendChild(document.createElementNS(NS, "line"));
})();

const HUES = [190, 125, 40, 0, 275, 330, 215];
let hueNow = 190;
function setHue(h) {
  hueNow = h;
  const set = (id, c) => $(id).setAttribute("stop-color", c);
  set("i0", `hsl(${h},85%,20%)`); set("i1", `hsl(${h},95%,60%)`);
  set("i2", `hsl(${h},90%,40%)`); set("i3", `hsl(${h},90%,10%)`);
  set("g0", `hsl(${h},100%,72%)`); set("g1", `hsl(${h},100%,40%)`);
  $("fibL").setAttribute("stroke", `hsl(${h},100%,80%)`);
  $("colr").setAttribute("stroke", `hsl(${h},100%,85%)`);
}
setHue(190);

const eye = { gx: 0, gy: 0, tx: 0, ty: 0, o: 1, blinking: false, bt: 0, changed: false, next: performance.now() + 2500, nextLook: 0, mouse: false, mouseT: 0 };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

window.addEventListener("pointermove", e => {
  const r = $("eyesvg").getBoundingClientRect();
  const dx = (e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2);
  const dy = (e.clientY - (r.top + r.height / 2)) / (window.innerHeight / 2);
  eye.tx = clamp(dx * 34, -30, 30); eye.ty = clamp(dy * 14, -10, 10);
  eye.mouse = true; eye.mouseT = performance.now();
});

let lastT = performance.now();
function frame(t) {
  const dt = Math.min(50, t - lastT); lastT = t;
  if (t > eye.nextLook) {
    if (!eye.mouse || t > eye.mouseT + 2500) {
      eye.mouse = false;
      eye.tx = (Math.random() * 2 - 1) * 26;
      eye.ty = (Math.random() * 2 - 1) * 8;
    }
    eye.nextLook = t + 500 + Math.random() * 1800;
  }
  const k = Math.min(1, dt * 0.02);
  eye.gx += (eye.tx - eye.gx) * k;
  eye.gy += (eye.ty - eye.gy) * k;

  if (!eye.blinking && t > eye.next) { eye.blinking = true; eye.bt = 0; eye.changed = false; }
  if (eye.blinking) {
    eye.bt += dt / 260;
    if (eye.bt >= 0.5 && !eye.changed) {
      eye.changed = true;
      let h; do { h = HUES[Math.floor(Math.random() * HUES.length)]; } while (h === hueNow);
      setHue(h);
    }
    if (eye.bt >= 1) {
      eye.blinking = false; eye.o = 1;
      eye.next = t + (Math.random() < 0.2 ? 250 : 2200 + Math.random() * 3800);
    } else eye.o = 1 - Math.sin(Math.PI * eye.bt);
  }

  const base = thinking ? 8 : listening ? 14 : 11;
  $("pupil").setAttribute("r", (base + Math.sin(t / 900) * 0.6).toFixed(2));
  $("gaze").setAttribute("transform", `translate(${eye.gx.toFixed(2)} ${eye.gy.toFixed(2)})`);

  const o = eye.o, cu = 100 - 70 * o, cl = 100 + 70 * o;
  $("lidU").setAttribute("d", `M20,100 Q100,${cu.toFixed(2)} 180,100 L180,0 L20,0 Z`);

  }

}

function inPoly(lon, lat, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
let LAND = null;
function buildLand() {
  LAND = new Uint8Array(180 * 90);
  for (let iy = 0; iy < 90; iy++) {
    const lat = 90 - iy * 2 - 1;
    for (let ix = 0; ix < 180; ix++) {
      const lon = ix * 2 - 180 + 1;
      let l = lat < -67;
      if (!l) for (const p of POLYS) { if (inPoly(lon, lat, p)) { l = true; break; } }
      LAND[iy * 180 + ix] = l ? 1 : 0;
    }
  }
}
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

function renderEarth(size, lon0, lat0) {
  if (!LAND) buildLand();
  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const cx = cv.getContext("2d");
  const img = cx.createImageData(size, size);
  const d = img.data;
  const now = new Date();
  const utcH = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
  const doy = (now - Date.UTC(now.getUTCFullYear(), 0, 0)) / 86400000;
  const dec = 23.44 * Math.sin(2 * Math.PI * (doy - 81) / 365) * Math.PI / 180;
  const lons = -(utcH - 12) * 15 * Math.PI / 180;
  const sinD = Math.sin(dec), cosD = Math.cos(dec);
  const p0 = lat0 * Math.PI / 180, l0 = lon0 * Math.PI / 180;
  const sp = Math.sin(p0), cp = Math.cos(p0);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const nx = (x + 0.5) / size * 2 - 1, ny = 1 - (y + 0.5) / size * 2;
      const rho = Math.hypot(nx, ny);
      if (rho >= 1) continue;
      const c = Math.asin(rho), sc = Math.sin(c), cc = Math.cos(c);
      let phi, lam;
      if (rho < 1e-6) { phi = p0; lam = l0; }
      else {
        phi = Math.asin(clamp(cc * sp + ny * sc * cp / rho, -1, 1));
        lam = l0 + Math.atan2(nx * sc, rho * cp * cc - ny * sp * sc);
      }
      const latD = phi * 180 / Math.PI;
      let lonD = lam * 180 / Math.PI; lonD = ((lonD + 540) % 360) - 180;
      const ix = Math.min(179, Math.floor((lonD + 180) / 2));
      const iy = clamp(Math.floor((90 - latD) / 2), 0, 89);
      const land = LAND[iy * 180 + ix];
      const dot = Math.sin(phi) * sinD + Math.cos(phi) * cosD * Math.cos(lam - lons);
      const f = smooth(-0.1, 0.2, dot);
      const lit = (0.55 + 0.45 * Math.max(dot, 0)) * (0.65 + 0.35 * cc);
      const al = Math.abs(latD);
      let dr, dg, db, nr, ng, nb;
      if (land) {
        if (al > 68) { dr = 236; dg = 246; db = 250; }
        else if (al < 18) { dr = 38; dg = 120; db = 60; }
        else if (al < 33) { dr = 178; dg = 152; db = 98; }
        else { dr = 62; dg = 132; db = 72; }
        nr = 14; ng = 28; nb = 30;
      } else { dr = 22; dg = 90; db = 172; nr = 4; ng = 10; nb = 26; }
      const i = (y * size + x) * 4;
      d[i] = nr + (dr * lit - nr) * f;
      d[i + 1] = ng + (dg * lit - ng) * f;
      d[i + 2] = nb + (db * lit - nb) * f;
      d[i + 3] = clamp((1 - rho) * size * 0.5, 0, 1) * 255;
    }
  }
  cx.putImageData(img, 0, 0);
  return cv;
}

const bg = $("bg"), bctx = bg.getContext("2d");
function shade(x, y, r) {
  const g = bctx.createRadialGradient(x - r * .4, y - r * .4, r * .1, x, y, r * 1.05);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(.6, "rgba(0,0,0,.25)"); g.addColorStop(1, "rgba(0,0,0,.85)");
  bctx.fillStyle = g; bctx.beginPath(); bctx.arc(x, y, r, 0, 7); bctx.fill();
}
function banded(x, y, r, cols, tilt) {
  bctx.save(); bctx.beginPath(); bctx.arc(x, y, r, 0, 7); bctx.clip();
  bctx.translate(x, y); bctx.rotate(tilt);
  const n = cols.length;
  for (let i = 0; i < n; i++) { bctx.fillStyle = cols[i]; bctx.fillRect(-r * 1.5, -r + i * (2 * r / n), 3 * r, 2 * r / n + 1); }
  bctx.restore(); shade(x, y, r);
}
function glow(x, y, r, col) {
  const g = bctx.createRadialGradient(x, y, r * .95, x, y, r * 1.35);
  g.addColorStop(0, col); g.addColorStop(1, "rgba(0,0,0,0)");
  bctx.fillStyle = g; bctx.beginPath(); bctx.arc(x, y, r * 1.35, 0, 7); bctx.fill();
}
function getLoc() { try { return JSON.parse(store.get("jarvis_loc", "null")); } catch (e) { return null; } }

function drawScene() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  bg.width = w * dpr; bg.height = h * dpr; bg.style.width = w + "px"; bg.style.height = h + "px";
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = bctx.createRadialGradient(w / 2, h * .25, 10, w / 2, h * .25, Math.max(w, h));
  sky.addColorStop(0, "#0a2236"); sky.addColorStop(1, "#02070d");
  bctx.fillStyle = sky; bctx.fillRect(0, 0, w, h);
  let s = 12345; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 260; i++) {
    const x = rnd() * w, y = rnd() * h, r = rnd() * 1.3 + .2, a = rnd() * .7 + .2;
    bctx.fillStyle = `rgba(200,235,255,${a})`; bctx.beginPath(); bctx.arc(x, y, r, 0, 7); bctx.fill();
  }
  const m = Math.min(w, h);
  // gigante gassoso
  glow(w * .9, h * .2, m * .12, "rgba(255,170,90,.25)");
  banded(w * .9, h * .2, m * .12, ["#c98b5a", "#e6b98a", "#a5683f", "#d9a673", "#b57a4b", "#e8c79c", "#9b5f3a"], -0.15);
  // pianeta rosso
  glow(w * .06, h * .72, m * .07, "rgba(255,80,50,.25)");
  banded(w * .06, h * .72, m * .07, ["#a33c25", "#c4573a", "#8e2f1d", "#b8482f"], 0.3);
  // pianeta ad anelli
  const rx = w * .93, ry = h * .62, rr = m * .07;
  bctx.save(); bctx.strokeStyle = "rgba(220,200,160,.55)"; bctx.lineWidth = rr * .28;
  bctx.beginPath(); bctx.ellipse(rx, ry, rr * 1.9, rr * .5, -0.4, Math.PI, 2 * Math.PI); bctx.stroke(); bctx.restore();
  banded(rx, ry, rr, ["#d8c48c", "#c2ab70", "#e4d4a2", "#b9a265"], -0.4);
  bctx.save(); bctx.strokeStyle = "rgba(235,215,170,.8)"; bctx.lineWidth = rr * .28;
  bctx.beginPath(); bctx.ellipse(rx, ry, rr * 1.9, rr * .5, -0.4, 0, Math.PI); bctx.stroke(); bctx.restore();
  // Terra
  const er = m * 0.15;
  const ex = Math.max(er * 1.15, w * .11), ey = Math.max(er * 1.2, h * .25);
  const loc = getLoc();
  const lon0 = loc ? loc.lon : 12.5;
  const lat0 = loc ? clamp(loc.lat * 0.5 + 10, -30, 50) : 25;
  glow(ex, ey, er, "rgba(90,170,255,.5)");
  bctx.drawImage(renderEarth(240, lon0, lat0), ex - er, ey - er, 2 * er, 2 * er);
  // luna
  banded(ex + er * 1.6, ey - er * .8, m * .022, ["#b9b9b9", "#9d9d9d", "#c8c8c8"], 0.5);
}

/* Meteo */
function wcode(c, isDay) {
  const day = isDay !== 0;
  if (c === 0) return { e: day ? "☀️" : "🌙", t: "sereno" };
  if (c === 1) return { e: day ? "🌤️" : "🌙", t: "prevalentemente sereno" };
  if (c === 2) return { e: "⛅", t: "parzialmente nuvoloso" };
  if (c === 3) return { e: "☁️", t: "coperto" };
  if (c === 45 || c === 48) return { e: "🌫️", t: "nebbia" };
  if (c >= 51 && c <= 57) return { e: "🌦️", t: "pioviggine" };
  if (c >= 61 && c <= 67) return { e: "🌧️", t: "pioggia" };
  if (c >= 71 && c <= 77) return { e: "❄️", t: "neve" };
  if (c >= 80 && c <= 82) return { e: "🌦️", t: "rovesci" };
  if (c === 85 || c === 86) return { e: "🌨️", t: "rovesci di neve" };
  if (c >= 95) return { e: "⛈️", t: "temporale" };
  return { e: "🌡️", t: "variabile" };
}
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("Geolocalizzazione non disponibile"));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(new Error(e.code === 1 ? "Permesso di posizione negato. Abilitalo in Impostazioni → Privacy → Localizzazione → Safari." : "Posizione non disponibile")), { timeout: 15000, maximumAge: 600000 });
  });
}
async function loadWeather() {
  const c = await getPos();
  const lat = c.latitude, lon = c.longitude;
  store.set("jarvis_loc", JSON.stringify({ lat, lon }));
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3`;
  const r = await fetch(url);
  const j = await r.json();
  if (!j.current) throw new Error("Meteo non disponibile");
  let city = "";
  try {
    const g = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=it`)).json();
    city = g.city || g.locality || g.principalSubdivision || "";
  } catch (e) {}
  WX = {
    city, temp: j.current.temperature_2m, feels: j.current.apparent_temperature, hum: j.current.relative_humidity_2m,
    wind: j.current.wind_speed_10m, code: j.current.weather_code, isDay: j.current.is_day,
    days: j.daily.time.map((t, i) => ({ date: t, code: j.daily.weather_code[i], max: j.daily.temperature_2m_max[i], min: j.daily.temperature_2m_min[i], rain: j.daily.precipitation_probability_max[i] }))
  };
  $("satMi").textContent = Math.round(WX.temp) + "°";
  drawScene();
}
function weatherHtml() {
  const w = WX, c = wcode(w.code, w.isDay);
  const names = ["Oggi", "Domani", "Dopodomani"];
  return `
    <div class="sub">${esc(w.city || "La tua posizione")}</div>
    <div class="big">${c.e} ${Math.round(w.temp)}°</div>
    <div class="sub">${esc(c.t)} · percepita ${Math.round(w.feels)}° · umidità ${w.hum}% · vento ${Math.round(w.wind)} km/h</div>
    ${w.days.map((d, i) => `<div class="wc"><span>${names[i] || d.date}</span><span>${wcode(d.code, 1).e} ${Math.round(d.min)}° / ${Math.round(d.max)}° · 💧${d.rain == null ? "-" : d.rain}%</span></div>`).join("")}
    <div class="row"><button id="wref">↻ Aggiorna</button><button id="wsay">🔊 Leggimi il meteo</button></div>`;
}
function bindWeather() {
  $("wref").onclick = () => showWeather(true);
  $("wsay").onclick = () => {
    const c = wcode(WX.code, WX.isDay);
    speak((WX.city ? "A " + WX.city + " " : "") + "ci sono " + Math.round(WX.temp) + " gradi, " + c.t + ". Oggi minima " + Math.round(WX.days[0].min) + ", massima " + Math.round(WX.days[0].max) + ".");
  };
}
async function showWeather(force) {
  if (WX && !force) { openPanel("METEO", weatherHtml()); bindWeather(); return; }
  openPanel("METEO", `<div class="sub">Rilevo la posizione…</div>`);
  try {
    await loadWeather();
    $("pbody").innerHTML = weatherHtml(); bindWeather();
  } catch (e) {
    $("pbody").innerHTML = `<div class="sub">${esc(e.message)}</div><div class="row"><button id="wref">Riprova</button></div>`;
    $("wref").onclick = () => showWeather(true);
  }
}
