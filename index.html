<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="theme-color" content="#02070d">
<title>Jarvis</title>
<style>
  :root { --c: #3fd8ff; --c2: #0e6f93; --bg: #02070d; --spd: 1; }
  body.listening { --c: #7dffb2; --c2: #1d8a55; }
  body.thinking { --c: #ffc95c; --c2: #8a6a1d; --spd: 0.2; }
  body.speaking { --spd: 0.4; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: #cdf3ff;
    font-family: -apple-system, "Helvetica Neue", Helvetica, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; position: relative;
    height: 100vh; height: 100dvh;
  }
  #bg { position: fixed; left: 0; top: 0; z-index: 0; pointer-events: none; animation: drift 45s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: scale(1.03) translate(-6px, 4px); } to { transform: scale(1.03) translate(6px, -4px); } }
  #planets { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .pl { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .10; z-index: 1;
    background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, #000 3px); }
  header { display: flex; justify-content: space-between; align-items: center;
    padding: calc(10px + env(safe-area-inset-top)) 20px 6px; z-index: 5; position: relative; }
  .brand { letter-spacing: 8px; font-size: 20px; color: var(--c); text-shadow: 0 0 14px var(--c); transition: color .4s; }
  button { border: 1px solid var(--c); background: rgba(10,34,51,.7); color: var(--c); border-radius: 12px;
    padding: 12px 16px; font-size: 16px; transition: all .3s; font-family: inherit; }
  button:active { background: var(--c); color: var(--bg); }
  #gear { padding: 6px 12px; font-size: 15px; }

  #settings { display: none; position: absolute; top: calc(52px + env(safe-area-inset-top)); left: 16px; right: 16px;
    padding: 14px; border: 1px solid var(--c2); border-radius: 12px; background: rgba(4,16,26,.96); z-index: 15; }
  #settings input { width: 100%; padding: 10px; margin: 6px 0 10px; border-radius: 10px; border: 1px solid var(--c2);
    background: #06131d; color: #cdf3ff; font-size: 16px; }

  #hud { position: relative; height: 54vh; min-height: 320px; max-height: 560px; z-index: 2; flex: 0 0 auto; }
  #eyewrap { position: absolute; left: 50%; top: 18px; bottom: 78px; aspect-ratio: 1; transform: translateX(-50%); }
  #eyesvg { width: 100%; height: 100%; filter: drop-shadow(0 0 12px var(--c)); overflow: visible; display: block; }
  .ring { fill: none; stroke: var(--c); transform-box: view-box; transform-origin: 50% 50%; transition: stroke .4s; }
  .r1 { stroke-width: 1.2; stroke-dasharray: 2 5; animation: spin calc(40s * var(--spd)) linear infinite; }
  .r2 { stroke-width: 3; stroke-dasharray: 60 20 10 20; animation: spin calc(14s * var(--spd)) linear infinite reverse; }
  .r3 { stroke-width: 1.5; stroke-dasharray: 90 30; animation: spin calc(22s * var(--spd)) linear infinite; }
  .r4 { stroke-width: 4; stroke-dasharray: 30 24; opacity: .8; animation: spin calc(9s * var(--spd)) linear infinite reverse; }
  .core { animation: pulse calc(3s * var(--spd)) ease-in-out infinite; transform-box: view-box; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .8; } 50% { transform: scale(1.06); opacity: 1; } }
  #status { position: absolute; top: 0; left: 0; right: 0; text-align: center; font-size: 11px; letter-spacing: 5px;
    color: var(--c); text-shadow: 0 0 8px var(--c); transition: color .4s; z-index: 3; }

  .sat { position: absolute; width: 66px; height: 66px; border-radius: 50%; padding: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 19px; line-height: 1.1;
    background: radial-gradient(circle, rgba(14,60,84,.85), rgba(4,16,26,.92)); border: 1.5px solid var(--c); box-shadow: 0 0 14px var(--c2); z-index: 4; }
  .sat small { font-size: 9px; letter-spacing: 1.5px; opacity: .85; }
  .sat::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1px dashed var(--c); opacity: .6; animation: spin 14s linear infinite; }
  .sat::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c);
    top: -10px; left: 30px; transform-origin: 3px 43px; animation: spin 7s linear infinite; }
  #satV { left: max(10px, calc(50% - 250px)); top: calc(50% - 60px); }
  #satM { right: max(10px, calc(50% - 250px)); top: calc(50% - 60px); }
  #satT { left: 50%; bottom: 6px; margin-left: -33px; }
  #satD { right: max(10px, calc(50% - 200px)); bottom: 6px; }

  #chat { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 12px; z-index: 2; -webkit-overflow-scrolling: touch; position: relative; }
  .msg { max-width: 82%; margin: 8px 0; padding: 10px 14px; line-height: 1.45; white-space: pre-wrap; font-size: 16px; }
  .bot { background: linear-gradient(135deg, rgba(8,30,46,.88), rgba(5,16,26,.88)); border: 1px solid var(--c2); border-left: 3px solid var(--c); border-radius: 4px 14px 14px 14px; }
  .user { margin-left: auto; text-align: right; background: rgba(14,60,84,.6); border: 1px solid var(--c2); border-right: 3px solid var(--c); border-radius: 14px 4px 14px 14px; }
  .act { display: block; margin-top: 8px; padding: 8px 14px; font-size: 14px; }

  #bar { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--c2); background: rgba(2,10,16,.88); z-index: 5; position: relative; }
  #text { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--c2); background: #06131d; color: #cdf3ff; font-size: 16px; outline: none; }
  #text:focus { border-color: var(--c); box-shadow: 0 0 10px var(--c2); }
  #mic.on { background: var(--c); color: var(--bg); box-shadow: 0 0 16px var(--c); }

  #overlay { position: fixed; inset: 0; background: rgba(0,5,10,.62); display: none; align-items: center; justify-content: center; z-index: 30; }
  #panel { width: min(92vw, 520px); max-height: 82vh; overflow: auto; border: 1px solid var(--c); border-radius: 16px;
    background: rgba(4,16,26,.96); box-shadow: 0 0 30px var(--c2); padding: 18px; }
  .phead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  #ptitle { letter-spacing: 5px; color: var(--c); font-size: 15px; }
  #pclose { padding: 6px 12px; }
  #panel label { display: block; font-size: 12px; letter-spacing: 2px; color: var(--c); margin: 12px 0 6px; opacity: .85; }
  #panel select, #panel input[type=text] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--c2); background: #06131d; color: #cdf3ff; font-size: 16px; }
  #panel input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .row button { padding: 9px 14px; font-size: 14px; }
  .big { font-size: 54px; text-align: center; color: var(--c); text-shadow: 0 0 16px var(--c); font-variant-numeric: tabular-nums; letter-spacing: 2px; }
  .sub { text-align: center; opacity: .8; margin-bottom: 10px; }
  .wc { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--c2); font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; opacity: .65; margin-top: 10px; line-height: 1.4; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="planets" aria-hidden="true"></div>

<header>
  <div class="brand">JARVIS</div>
  <button id="gear">⚙︎</button>
</header>

<div id="settings">
  Chiave API Gemini:
  <input id="key" type="password" placeholder="Incolla qui la chiave (vuoto = non cambiare)">
  Modello chat:
  <input id="model" type="text">
  Modello voce:
  <input id="ttsmodel" type="text">
  <button id="save">Salva</button>
</div>

<div id="hud">
  <div id="status">SISTEMI IN AVVIO</div>
  <div id="eyewrap">
    <svg id="eyesvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="coreGrad">
          <stop id="g0" offset="0%" stop-color="#9eeaff"/>
          <stop id="g1" offset="60%" stop-color="#0a7fa6" stop-opacity=".5"/>
          <stop offset="100%" stop-color="#0a5f80" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="sclera" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#f7fafc"/>
          <stop offset="60%" stop-color="#e3eaf0"/>
          <stop offset="100%" stop-color="#b58c8c"/>
        </radialGradient>
        <radialGradient id="irisG">
          <stop id="i0" offset="0%" stop-color="#0b3a4a"/>

          <stop id="i2" offset="82%" stop-color="#1590b5"/>
          <stop id="i3" offset="100%" stop-color="#03141b"/>
        </radialGradient>

        <g stroke="#b33" fill="none" stroke-width=".5" opacity=".35">
          <path d="M22,100 Q40,96 58,98"/><path d="M26,104 Q44,106 60,103"/>
          <path d="M34,98 Q42,90 50,88"/><path d="M178,100 Q160,96 142,98"/>

        </g>
        <g id="gaze">

          <g id="fibD" stroke="#000" stroke-width=".7" opacity=".5"></g>

          <circle id="colr" cx="100" cy="100" r="16" fill="none" stroke="#fff" stroke-width="1.6" opacity=".35"/>
          <circle cx="100" cy="100" r="30.5" fill="none" stroke="#000" stroke-width="3.2" opacity=".85"/>
          <circle id="pupil" cx="100" cy="100" r="11" fill="#000"/>
        </g>
        <ellipse cx="85" cy="85" rx="9" ry="5" fill="#fff" opacity=".85" transform="rotate(-25 85 85)"/>
        <circle cx="117" cy="114" r="3" fill="#fff" opacity=".5"/>

        <path id="lidU" fill="#04101a"/>
        <path id="lidL" fill="#04101a"/>
      </g>
      <path d="M28,88 Q100,8 172,88" fill="none" style="stroke:var(--c2)" stroke-width="1.2" opacity=".6"/>
      <path id="edgeU" fill="none" style="stroke:var(--c)" stroke-width="1.8" stroke-linecap="round"/>
      <path id="edgeL" fill="none" style="stroke:var(--c)" stroke-width="1.8" stroke-linecap="round"/>

    </svg>
  </div>

  <button class="sat" id="satV"><span>🔊</span><small>VOCE</small></button>
  <button class="sat" id="satM"><span id="satMi">🌤️</span><small>METEO</small></button>
  <button class="sat" id="satT"><span id="satTi" style="font-size:17px">--:--</span><small>ORA</small></button>

<div id="chat"></div>

<div id="bar">
  <button id="mic">🎤</button>
  <input id="text" type="text" placeholder="Scrivi o tocca il microfono…">

</div>

<div id="overlay"><div id="panel">
  <div class="phead"><div id="ptitle"></div><button id="pclose">✕</button></div>
  <div id="pbody"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SYSTEM = "Sei Jarvis, un assistente personale in stile maggiordomo high-tech, elegante, impassibile e con un forte senso dell'humor nero: ironia macabra, sarcasmo asciutto, battute su morte, futilità dell'esistenza, polvere e decadenza. Rispondi sempre in italiano, in modo breve (massimo 3-4 frasi). Dai prima l'informazione utile, poi al massimo una battuta nera. Regole: l'umorismo nero non deve mai prendere di mira gruppi di persone, tragedie reali o persone reali; se l'utente sembra in difficoltà emotiva, parla di salute, sicurezza o emergenze, abbandona le battute e rispondi con serietà e gentilezza. Non usare elenchi puntati né asterischi: le tue risposte vengono lette ad alta voce.";
const DEFAULT_MODEL = "gemini-3.5-flash-lite";
const TTS_MODELS = ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"];
let history = [];
let listening = false, thinking = false, speaking = false, preparing = false;
let WX = null;

$("model").value = store.get("jarvis_model", DEFAULT_MODEL);
$("ttsmodel").value = store.get("jarvis_ttsmodel", TTS_MODELS[0]);
if (!store.get("jarvis_key", "")) $("settings").style.display = "block";

/* ---------- STATO ---------- */
function setState() {
  document.body.classList.toggle("listening", listening);
  document.body.classList.toggle("thinking", thinking || preparing);
  document.body.classList.toggle("speaking", speaking);
  $("status").textContent = listening ? "TI ASCOLTO…" : thinking ? "ELABORO…" : preparing ? "PREPARO LA VOCE…" : speaking ? "PARLO…" : "IN ATTESA";
}

/* ---------- IMPOSTAZIONI ---------- */
$("gear").onclick = () => { $("settings").style.display = $("settings").style.display === "block" ? "none" : "block"; };
$("save").onclick = () => {
  if ($("key").value.trim()) store.set("jarvis_key", $("key").value.trim());
  store.set("jarvis_model", $("model").value.trim() || DEFAULT_MODEL);
  store.set("jarvis_ttsmodel", $("ttsmodel").value.trim() || TTS_MODELS[0]);
  $("key").value = "";
  $("settings").style.display = "none";
  addMsg("Impostazioni salvate. Che emozione.", "bot");
};

/* ---------- CHAT ---------- */
function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}
function addAction(msgEl, label, fn) {
  const b = document.createElement("button");
  b.className = "act"; b.textContent = label; b.onclick = fn;
  msgEl.appendChild(b);
  $("chat").scrollTop = $("chat").scrollHeight;
}

/* ---------- VOCE ---------- */
const GVOICES = [
  ["Charon", "informativa"], ["Kore", "decisa"], ["Puck", "vivace"], ["Zephyr", "brillante"], ["Fenrir", "energica"],
  ["Leda", "giovane"], ["Orus", "decisa"], ["Aoede", "leggera"], ["Callirrhoe", "rilassata"], ["Autonoe", "brillante"],
  ["Enceladus", "soffiata"], ["Iapetus", "chiara"], ["Umbriel", "rilassata"], ["Algieba", "morbida"], ["Despina", "morbida"],
  ["Erinome", "chiara"], ["Algenib", "roca"], ["Rasalgethi", "informativa"], ["Laomedeia", "vivace"], ["Achernar", "soffice"],
  ["Alnilam", "decisa"], ["Schedar", "uniforme"], ["Gacrux", "matura"], ["Pulcherrima", "diretta"], ["Achird", "amichevole"],
  ["Zubenelgenubi", "informale"], ["Vindemiatrix", "gentile"], ["Sadachbia", "vivace"], ["Sadaltager", "esperta"], ["Sulafat", "calda"]
];
const STYLES = [
  ["ironico", "Ironico e impassibile"], ["", "Naturale"], ["calmo", "Calmo e posato"], ["maggiordomo", "Elegante da maggiordomo"],
  ["energico", "Energico"], ["caldo", "Caldo e amichevole"], ["sussurro", "Sussurrato"]
];
const STYLE_TXT = {
  "": "Leggi in italiano: ",
  ironico: "Leggi in italiano con tono ironico, impassibile e sarcastico: ",
  calmo: "Leggi in italiano con tono calmo e posato: ",
  maggiordomo: "Leggi in italiano con tono elegante e cortese, come un maggiordomo: ",
  energico: "Leggi in italiano con tono energico e deciso: ",
  caldo: "Leggi in italiano con tono caldo e amichevole: ",
  sussurro: "Leggi in italiano sussurrando: "
};
let voiceCfg = { engine: "gemini", gname: "Charon", style: "ironico", name: "", rate: 1, pitch: 1 };
try { Object.assign(voiceCfg, JSON.parse(store.get("jarvis_voice", "{}"))); } catch (e) {}
function saveVoice() { store.set("jarvis_voice", JSON.stringify(voiceCfg)); }
function itVoices() {
  if (!window.speechSynthesis) return [];
  return speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("it"));
}
if (window.speechSynthesis) speechSynthesis.getVoices();

const player = new Audio();
player.preload = "auto";
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
let audioUnlocked = false, curUrl = null, ttsErrShown = false, speakToken = 0;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    player.src = SILENT;
    const p = player.play();
    if (p && p.catch) p.catch(() => { audioUnlocked = false; });
  } catch (e) { audioUnlocked = false; }
}
["pointerdown", "touchend", "click", "keydown"].forEach(ev => document.addEventListener(ev, unlockAudio, { passive: true }));

function pcmToWav(bytes, rate) {
  const n = bytes.length, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n, true);
  new Uint8Array(buf, 44).set(bytes);
  return new Blob([buf], { type: "audio/wav" });
}

async function geminiTTS(text) {
  const key = store.get("jarvis_key", "");
  if (!key) throw new Error("chiave API mancante");
  const pref = store.get("jarvis_ttsmodel", TTS_MODELS[0]);
  const models = [pref].concat(TTS_MODELS.filter(m => m !== pref));
  let lastErr = new Error("nessun modello vocale disponibile");
  for (const model of models) {
    try {
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({
          contents: [{ parts: [{ text: (STYLE_TXT[voiceCfg.style] || STYLE_TXT[""]) + text }] }],
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voiceCfg.gname || "Charon" } } }
          }
        })
      });
      const data = await r.json();
      if (!r.ok) { lastErr = new Error((data.error && data.error.message) || ("errore " + r.status)); continue; }
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      const part = parts.find(p => p.inlineData);
      if (!part) { lastErr = new Error("nessun audio ricevuto"); continue; }
      const m = /rate=(\d+)/.exec(part.inlineData.mimeType || "");
      const bin = atob(part.inlineData.data);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      if (model !== pref) store.set("jarvis_ttsmodel", model);
      return { bytes, rate: m ? Number(m[1]) : 24000 };
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function playWav(blob) {
  return new Promise((res, rej) => {
    if (curUrl) URL.revokeObjectURL(curUrl);
    curUrl = URL.createObjectURL(blob);
    player.onplay = () => { preparing = false; speaking = true; setState(); };
    player.onended = () => { speaking = false; setState(); res(); };
    player.onerror = () => { speaking = false; preparing = false; setState(); rej(new Error("riproduzione audio non riuscita")); };
    player.src = curUrl;
    const rate = Number(voiceCfg.rate) || 1;
    player.defaultPlaybackRate = rate;
    player.playbackRate = rate;
    const p = player.play();
    if (p && p.catch) p.catch(e => { speaking = false; preparing = false; setState(); rej(e); });
  });
}

function speakSafari(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "it-IT";
  const it = itVoices();

const planetsEl = $("planets");

function getLoc() { try { return JSON.parse(store.get("jarvis_loc", "null")); } catch (e) { return null; } }

function refreshEarth() {
  const p = PL.earth;
  if (!p) return;
  const loc = getLoc();
  const lon0 = loc ? loc.lon : 12.5;
  const lat0 = loc ? clamp(loc.lat * 0.5 + 10, -30, 50) : 25;

  const cx = p.el.getContext("2d");
  cx.clearRect(0, 0, 300, 300);
  cx.drawImage(cv, 0, 0);
}

function layoutScene() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight, m = Math.min(w, h);
  drawStars(w, h, dpr);
  const ec = { x: w / 2, y: h * 0.3 };
  const lightFor = (cx, cy) => {
    const x = (ec.x - cx) / w * 1.8, y = (cy - ec.y) / h * 1.8, z = 0.55;
    const l = Math.hypot(x, y, z);
    return [x / l, y / l, z / l];
  };
  const key = w + "x" + h;
  const defs = [
    { k: "gas", cx: w * 0.9, cy: h * 0.2, r: m * 0.12, depth: 14, sp: SPEC_GAS },
    { k: "mars", cx: w * 0.07, cy: h * 0.74, r: m * 0.07, depth: 20, sp: SPEC_MARS },
    { k: "sat", cx: w * 0.86, cy: h * 0.64, r: m * 0.065, depth: 22, sp: SPEC_SAT }
  ];
  for (const df of defs) {
    let p = PL[df.k];
    if (!p || p.key !== key) {
      const side = 2 * df.r / df.sp.rad;
      const res = Math.round(Math.min(420, side * dpr));
      const cv = renderPlanet(df.sp, res, lightFor(df.cx, df.cy));
      cv.className = "pl";
      cv.style.width = side + "px"; cv.style.height = side + "px";
      if (p && p.el) p.el.remove();
      planetsEl.appendChild(cv);
      PL[df.k] = { el: cv, side, cx: df.cx, cy: df.cy, depth: df.depth, key, r: df.r, ox: 0, oy: 0 };
    }
  }
  const er = m * 0.15;
  const ex = Math.max(er * 1.15, w * 0.11), ey = Math.max(er * 1.2, h * 0.25);
  if (!PL.earth || PL.earth.key !== key) {
    const side = 2 * er / 0.8;
    const el = document.createElement("canvas");
    el.className = "pl"; el.width = 300; el.height = 300;
    el.style.width = side + "px"; el.style.height = side + "px"; el.style.zIndex = 1;
    if (PL.earth) PL.earth.el.remove();
    planetsEl.appendChild(el);
    PL.earth = { el, side, cx: ex, cy: ey, depth: 32, key, r: er, ox: 0, oy: 0 };
  }
  refreshEarth();
  if (!PL.moon || PL.moon.key !== key) {
    const r = m * 0.026, side = 2 * r / 0.8;
    const res = Math.max(64, Math.round(Math.min(220, side * dpr * 1.5)));
    const cv = renderPlanet(SPEC_MOON, res, lightFor(ex, ey));
    cv.className = "pl";
    cv.style.width = side + "px"; cv.style.height = side + "px";
    if (PL.moon) PL.moon.el.remove();
    planetsEl.appendChild(cv);
    PL.moon = { el: cv, side, cx: ex, cy: ey, depth: 40, key, r, ox: 0, oy: 0 };
  }
}

/* Meteo */
function wcode(c, isDay) {
  const day = isDay !== 0;
  if (c === 0) return { e: day ? "☀️" : "🌙", t: "sereno" };
  if (c === 1) return { e: day ? "🌤️" : "🌙", t: "prevalentemente sereno" };
  if (c === 2) return { e: "⛅", t: "parzialmente nuvoloso" };
  if (c === 3) return { e: "☁️", t: "coperto" };
  if (c === 45 || c === 48) return { e: "🌫️", t: "nebbia" };
  if (c >= 51 && c <= 57) return { e: "🌦️", t: "pioviggine" };
  if (c >= 61 && c <= 67) return { e: "🌧️", t: "pioggia" };
  if (c >= 71 && c <= 77) return { e: "❄️", t: "neve" };
  if (c >= 80 && c <= 82) return { e: "🌦️", t: "rovesci" };
  if (c === 85 || c === 86) return { e: "🌨️", t: "rovesci di neve" };
  if (c >= 95) return { e: "⛈️", t: "temporale" };
  return { e: "🌡️", t: "variabile" };
}
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("Geolocalizzazione non disponibile"));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(new Error(e.code === 1 ? "Permesso di posizione negato. Abilitalo in Impostazioni → Privacy → Localizzazione → Safari." : "Posizione non disponibile")), { timeout: 15000, maximumAge: 600000 });
  });
}
async function loadWeather() {
  const c = await getPos();
  const lat = c.latitude, lon = c.longitude;
  store.set("jarvis_loc", JSON.stringify({ lat, lon }));
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=3`;
  const r = await fetch(url);
  const j = await r.json();
  if (!j.current) throw new Error("Meteo non disponibile");
  let city = "";
  try {
    const g = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=it`)).json();
    city = g.city || g.locality || g.principalSubdivision || "";
  } catch (e) {}
  WX = {
    city, temp: j.current.temperature_2m, feels: j.current.apparent_temperature, hum: j.current.relative_humidity_2m,
    wind: j.current.wind_speed_10m, code: j.current.weather_code, isDay: j.current.is_day,
    days: j.daily.time.map((t, i) => ({ date: t, code: j.daily.weather_code[i], max: j.daily.temperature_2m_max[i], min: j.daily.temperature_2m_min[i], rain: j.daily.precipitation_probability_max[i] }))
  };
  $("satMi").textContent = Math.round(WX.temp) + "°";
  refreshEarth();
}
function weatherHtml() {
  const w = WX, c = wcode(w.code, w.isDay);
  const names = ["Oggi", "Domani", "Dopodomani"];
  return `
    <div class="sub">${esc(w.city || "La tua posizione")}</div>
    <div class="big">${c.e} ${Math.round(w.temp)}°</div>
    <div class="sub">${esc(c.t)} · percepita ${Math.round(w.feels)}° · umidità ${w.hum}% · vento ${Math.round(w.wind)} km/h</div>
    ${w.days.map((d, i) => `<div class="wc"><span>${names[i] || d.date}</span><span>${wcode(d.code, 1).e} ${Math.round(d.min)}° / ${Math.round(d.max)}° · 💧${d.rain == null ? "-" : d.rain}%</span></div>`).join("")}
    <div class="row"><button id="wref">↻ Aggiorna</button><button id="wsay">🔊 Leggimi il meteo</button></div>`;
}
function bindWeather() {
  $("wref").onclick = () => showWeather(true);
  $("wsay").onclick = () => {
    const c = wcode(WX.code, WX.isDay);
    speak((WX.city ? "A " + WX.city + " " : "") + "ci sono " + Math.round(WX.temp) + " gradi, " + c.t + ". Oggi minima " + Math.round(WX.days[0].min) + ", massima " + Math.round(WX.days[0].max) + ".");
  };
}
async function showWeather(force) {
  if (WX && !force) { openPanel("METEO", weatherHtml(), "meteo"); bindWeather(); return; }
  openPanel("METEO", `<div class="sub">Rilevo la posizione…</div>`, "meteo");
  try {
    await loadWeather();
    $("pbody").innerHTML = weatherHtml(); bindWeather();
  } catch (e) {
    $("pbody").innerHTML = `<div class="sub">${esc(e.message)}</div><div class="row"><button id="wref">Riprova</button></div>`;
    $("wref").onclick = () => showWeather(true);
  }
}
$("satM").onclick = () => showWeather(false);

if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: "geolocation" }).then(p => { if (p.state === "granted") loadWeather().catch(() => {}); }).catch(() => {});
}

/* ---------- AVVIO ---------- */
setTimeout(() => { setState(); addMsg("Sistemi online. Un'altra serata, un altro passo verso l'inevitabile. Come posso aiutarla?", "bot"); }, 1800);
</script>
