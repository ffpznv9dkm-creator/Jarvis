<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<title>Jarvis</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #050b14; color: #bfefff; font-family: -apple-system, Helvetica, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px; text-align: center; letter-spacing: 6px; font-size: 22px; color: #3fd8ff; border-bottom: 1px solid #12344a; text-shadow: 0 0 12px #3fd8ff; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 85%; margin: 8px 0; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; }
  .user { margin-left: auto; background: #0e2a3d; border: 1px solid #1c5a7d; }
  .bot { background: #08141f; border: 1px solid #12344a; }
  #bar { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #12344a; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  #text { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #1c5a7d; background: #08141f; color: #bfefff; font-size: 16px; }
  button { border: 1px solid #3fd8ff; background: #0a2233; color: #3fd8ff; border-radius: 12px; padding: 12px 16px; font-size: 16px; }
  #mic.on { background: #3fd8ff; color: #050b14; }
  #settings { display: none; padding: 16px; border-bottom: 1px solid #12344a; }
  #settings input { width: 100%; padding: 10px; margin: 6px 0 10px; border-radius: 10px; border: 1px solid #1c5a7d; background: #08141f; color: #bfefff; font-size: 16px; }
  #gear { position: absolute; right: 12px; top: 12px; padding: 6px 10px; }
</style>
</head>
<body>
<header>JARVIS<button id="gear">⚙︎</button></header>
<div id="settings">
  Chiave API Gemini:
  <input id="key" type="password" placeholder="Incolla qui la chiave">
  Modello:
  <input id="model" type="text">
  <button id="save">Salva</button>
</div>
<div id="chat"></div>
<div id="bar">
  <button id="mic">🎤</button>
  <input id="text" type="text" placeholder="Scrivi o tocca il microfono…">
  <button id="send">Invia</button>
</div>

<script>
const $ = id => document.getElementById(id);
const SYSTEM = "Sei Jarvis, un assistente personale elegante, efficiente e cortese. Rispondi sempre in italiano, in modo breve e chiaro (massimo 3-4 frasi, salvo richiesta diversa). Non usare elenchi puntati né asterischi: le tue risposte vengono lette ad alta voce.";
let history = [];

$("model").value = localStorage.getItem("jarvis_model") || "gemini-2.5-flash";
if (!localStorage.getItem("jarvis_key")) $("settings").style.display = "block";

$("gear").onclick = () => { $("settings").style.display = $("settings").style.display === "block" ? "none" : "block"; };
$("save").onclick = () => {
  if ($("key").value.trim()) localStorage.setItem("jarvis_key", $("key").value.trim());
  localStorage.setItem("jarvis_model", $("model").value.trim() || "gemini-2.5-flash");
  $("key").value = "";
  $("settings").style.display = "none";
  addMsg("Impostazioni salvate.", "bot");
};

function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  $("chat").appendChild(d);
  $("chat").scrollTop = $("chat").scrollHeight;
  return d;
}

function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g, ""));
  u.lang = "it-IT";
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith("it"));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

async function ask(text) {
  const key = localStorage.getItem("jarvis_key");
  if (!key) { $("settings").style.display = "block"; addMsg("Inserisci prima la chiave API nelle impostazioni.", "bot"); return; }
  const model = localStorage.getItem("jarvis_model") || "gemini-2.5-flash";
  addMsg(text, "user");
  history.push({ role: "user", parts: [{ text }] });
  const wait = addMsg("…", "bot");
  try {
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: SYSTEM }] }, contents: history.slice(-20) })
    });
    const data = await r.json();
    if (!r.ok) throw new Error((data.error && data.error.message) || "Errore " + r.status);
    const answer = data.candidates[0].content.parts.map(p => p.text || "").join("");
    history.push({ role: "model", parts: [{ text: answer }] });
    wait.textContent = answer;
    speak(answer);
  } catch (e) {
    history.pop();
    wait.textContent = "Errore: " + e.message;
  }
}

function send() {
  const t = $("text").value.trim();
  if (!t) return;
  $("text").value = "";
  ask(t);
}
$("send").onclick = send;
$("text").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
$("mic").onclick = () => {
  speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  if (!SR) { addMsg("Il riconoscimento vocale non è disponibile. Usa la tastiera (e il microfono della tastiera dell'iPad).", "bot"); return; }
  if (listening) { rec.stop(); return; }
  rec = new SR();
  rec.lang = "it-IT";
  rec.interimResults = false;
  rec.onstart = () => { listening = true; $("mic").classList.add("on"); };
  rec.onend = () => { listening = false; $("mic").classList.remove("on"); };
  rec.onerror = e => addMsg("Errore microfono: " + e.error, "bot");
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.start();
};
</script>
</body>
</html>
